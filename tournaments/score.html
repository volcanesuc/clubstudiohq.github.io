<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Planillaje · ClubStudioHQ</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/tournaments/css/tournaments.css" />
</head>
<body class="tn-body">
  <main class="container py-3 ev-page" style="max-width:760px">
    <div class="alert d-none" id="tnAlert"></div>
    <div id="tnRoot"></div>
  </main>
  <!-- selector de jugador (sin animación: los toques rápidos en la cancha no se pierden) -->
  <div class="modal" id="skPicker" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="skPickerTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body"><div class="sk-players" id="skPickerList"></div></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/tournaments/js/scorer.js"></script>
</body>
</html>
