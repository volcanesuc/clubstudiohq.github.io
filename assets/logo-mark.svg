<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ClubStudioHQ">
  <title>ClubStudioHQ</title>
  <defs>
    <linearGradient id="cshq-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- fondo -->
  <rect width="64" height="64" rx="15" fill="url(#cshq-bg)"/>
  <!-- órbita de disco -->
  <ellipse cx="32" cy="29" rx="27" ry="10" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2.5" transform="rotate(-16 32 29)"/>
  <circle cx="55.5" cy="20.5" r="3.4" fill="#fff"/>
  <!-- monograma -->
  <text x="31" y="38" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="27" letter-spacing="-1.5" fill="#fff">CS</text>
  <!-- etiqueta HQ -->
  <rect x="19" y="44" width="26" height="12" rx="6" fill="#0b0b14" fill-opacity=".35"/>
  <text x="32" y="53.3" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9.5" letter-spacing="1.6" fill="#fff">HQ</text>
</svg>
